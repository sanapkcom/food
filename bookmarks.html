<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bookmarks – EATSPOT</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    <script src="auth.js"></script>
</head>
<body>

    <nav class="navbar">
        <div class="container">
            <h1 class="logo"><a href="index.html" style="color:white;text-decoration:none;">🍽️ EATSPOT</a></h1>
            <ul class="nav-links" id="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="index.html#explore">Explore</a></li>
                <li><a href="index.html#add-place">Add Place</a></li>
                <li><a href="bookmarks.html" style="background:rgba(255,255,255,0.18);border-radius:8px;">🔖 Bookmarks</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="contact.html">Contact</a></li>
                <li id="auth-nav" style="display:flex;align-items:center;gap:10px;"></li>
            </ul>
            <button class="hamburger-btn" id="hamburger-btn">☰</button>
        </div>
    </nav>

    <div class="static-hero">
        <div class="container">
            <h1>🔖 Your Bookmarks</h1>
            <p>Food spots you've saved for later</p>
        </div>
    </div>

    <section class="static-page">
        <div class="container">
            <div id="bookmarks-count" style="color:#64748b; margin-bottom:1.5rem; font-size:0.95rem;"></div>
            <div class="places-grid" id="bookmarks-grid">
                <div class="empty-state"><p>⏳ Loading…</p></div>
            </div>
        </div>
    </section>

    <!-- SPOT DETAIL MODAL (reused) -->
    <div id="spot-detail-modal" class="modal-overlay" style="display:none;">
        <div class="modal-box">
            <button class="modal-close-btn" onclick="closeSpotDetail()">✕</button>
            <div id="spot-detail-content"></div>
        </div>
    </div>

    <!-- REPORT MODAL -->
    <div id="report-modal" class="modal-overlay" style="display:none;">
        <div class="modal-box modal-box--small">
            <button class="modal-close-btn" onclick="closeReportModal()">✕</button>
            <h3>🚩 Report this Spot</h3>
            <p style="color:#64748b; margin-bottom:1rem;">Why are you reporting this place?</p>
            <select id="report-reason" style="width:100%;padding:12px;border-radius:10px;border:2px solid #e2e8f0;margin-bottom:1rem;font-family:inherit;">
                <option value="">Select a reason</option>
                <option value="closed">Place is permanently closed</option>
                <option value="wrong_info">Wrong information</option>
                <option value="spam">Spam or fake listing</option>
                <option value="inappropriate">Inappropriate content</option>
                <option value="other">Other</option>
            </select>
            <textarea id="report-details" placeholder="Additional details (optional)" style="width:100%;padding:12px;border-radius:10px;border:2px solid #e2e8f0;min-height:80px;font-family:inherit;resize:vertical;"></textarea>
            <button onclick="submitReport()" class="btn-primary" style="margin-top:1rem;width:100%;">Submit Report</button>
        </div>
    </div>

    <footer class="footer">
        <div class="container footer-inner">
            <p>&copy; 2025 EATSPOT. Discover food spots near you.</p>
            <div class="footer-links">
                <a href="about.html">About</a>
                <a href="contact.html">Contact / Help</a>
            </div>
        </div>
    </footer>

    <script>
        // Inline all needed functions from script.js for bookmarks page
        let allPlaces = [];
        let userLat = null;
        let userLng = null;
        let currentReportSpotId = null;

        function getBookmarks() {
            try { return JSON.parse(localStorage.getItem('eatspot_bookmarks') || '[]'); } catch { return []; }
        }

        function getDistance(lat1, lon1, lat2, lon2) {
            if (!lat1 || !lon1 || !lat2 || !lon2) return null;
            const R = 6371;
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const a = Math.sin(dLat / 2) ** 2 +
                Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * Math.sin(dLon / 2) ** 2;
            return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
        }

        function getOpenStatus(openTime, closeTime) {
            if (!openTime || !closeTime) return null;
            const now = new Date();
            const [oh, om] = openTime.split(':').map(Number);
            const [ch, cm] = closeTime.split(':').map(Number);
            const nowMins   = now.getHours() * 60 + now.getMinutes();
            const openMins  = oh * 60 + om;
            const closeMins = ch * 60 + cm;
            if (closeMins < openMins) {
                const isOpen = nowMins >= openMins || nowMins < closeMins;
                return isOpen ? { type: 'open', label: '🟢 Open Now' } : { type: 'closed', label: '🔴 Closed' };
            }
            const isOpen = nowMins >= openMins && nowMins < closeMins;
            if (isOpen && closeMins - nowMins <= 30) return { type: 'closing', label: '🟡 Closing Soon' };
            return isOpen ? { type: 'open', label: '🟢 Open Now' } : { type: 'closed', label: '🔴 Closed' };
        }

        function renderStars(rating) {
            return [1,2,3,4,5].map(i => `<span class="star">${i <= Math.round(rating||0) ? '★' : '☆'}</span>`).join('');
        }

        function toggleBookmark(id) {
            const bookmarks = getBookmarks();
            const idx = bookmarks.indexOf(String(id));
            if (idx === -1) { bookmarks.push(String(id)); }
            else { bookmarks.splice(idx, 1); }
            localStorage.setItem('eatspot_bookmarks', JSON.stringify(bookmarks));
            renderBookmarksPage();
        }

        function showToast(msg) {
            let toast = document.getElementById('eatspot-toast');
            if (!toast) {
                toast = document.createElement('div');
                toast.id = 'eatspot-toast';
                toast.className = 'toast-notification';
                document.body.appendChild(toast);
            }
            toast.textContent = msg;
            toast.classList.add('toast-visible');
            setTimeout(() => toast.classList.remove('toast-visible'), 2500);
        }

        function viewLocation(id) {
            const place = allPlaces.find(p => String(p.id) === String(id));
            if (place && place.lat && place.lng) {
                window.open(`https://www.google.com/maps/search/?api=1&query=${place.lat},${place.lng}`, '_blank');
            } else { alert('No coordinates for this spot.'); }
        }

        function getDirections(id) {
            const place = allPlaces.find(p => String(p.id) === String(id));
            if (!place?.lat || !place?.lng) { alert('No coordinates for this spot.'); return; }
            const dest = `${place.lat},${place.lng}`;
            if (userLat && userLng) {
                window.open(`https://www.google.com/maps/dir/${userLat},${userLng}/${dest}`, '_blank');
            } else {
                window.open(`https://www.google.com/maps/dir//${dest}`, '_blank');
            }
        }

        async function renderBookmarksPage() {
            const grid = document.getElementById('bookmarks-grid');
            const countEl = document.getElementById('bookmarks-count');
            const bookmarks = getBookmarks();

            if (bookmarks.length === 0) {
                grid.innerHTML = `
                    <div class="empty-state" style="grid-column:1/-1; padding:4rem 0; text-align:center;">
                        <div style="font-size:3.5rem; margin-bottom:1rem;">🔖</div>
                        <h3 style="color:#1e293b; margin-bottom:0.5rem;">No bookmarks yet</h3>
                        <p style="color:#64748b;">Go to <a href="index.html#explore" style="color:#88976c; font-weight:600;">Explore</a> and tap 🏷️ on any spot to save it here.</p>
                    </div>`;
                if (countEl) countEl.textContent = '';
                return;
            }

            const savedSpots = allPlaces.filter(p => bookmarks.includes(String(p.id)));

            if (countEl) countEl.textContent = `${savedSpots.length} saved spot${savedSpots.length !== 1 ? 's' : ''}`;

            if (savedSpots.length === 0) {
                grid.innerHTML = `<div class="empty-state" style="grid-column:1/-1;"><p>⏳ Loading spots…</p></div>`;
                return;
            }

            const { data: { user } } = await db.auth.getUser();

            const cards = savedSpots.map((place, index) => {
                const imageUrl = place.image_url || (place.image ? place.image : 'https://images.unsplash.com/photo-1504674900247-0877df9cc836?w=400&q=80');
                const openStatus = getOpenStatus(place.open_time, place.close_time);
                const hoursHtml = place.open_time && place.close_time
                    ? `<p class="place-hours">🕐 ${place.open_time} – ${place.close_time}</p>` : '';
                const avgRating = place.avg_rating || 0;
                const ratingCount = place.rating_count || 0;
                let distLabel = 'Distance unknown';
                if (userLat && userLng && place.lat && place.lng) {
                    const d = getDistance(userLat, userLng, place.lat, place.lng);
                    distLabel = d !== null ? `${d.toFixed(1)} km away` : 'Distance unknown';
                } else if (place.distance) {
                    distLabel = `${parseFloat(place.distance).toFixed(1)} km away`;
                }

                return `
                    <div class="place-card" style="animation-delay:${index * 0.08}s" onclick="openSpotDetail('${place.id}')">
                        <div class="card-image-container">
                            <img src="${imageUrl}" alt="${place.name}" class="place-image" onerror="this.src='https://images.unsplash.com/photo-1504674900247-0877df9cc836?w=400&q=80'">
                            <div class="card-badge"><span class="delivery-time">🕒 ${place.delivery_time || '–'} min</span></div>
                            ${openStatus ? `<div class="open-status-badge open-status--${openStatus.type}">${openStatus.label}</div>` : ''}
                            <button class="bookmark-btn" onclick="toggleBookmark('${place.id}'); event.stopPropagation();" title="Remove bookmark">🔖</button>
                        </div>
                        <div class="place-info">
                            <h4 class="place-name">${place.name}</h4>
                            <p class="place-location">📍 ${place.location || 'Location not added'}</p>
                            <span class="place-popular">🍽️ Type: ${place.food_type || 'General'}</span>
                            <p class="place-description">🥘 Foods: ${place.foods_available || 'Not added'}</p>
                            ${hoursHtml}
                            <p class="place-price price-range-badge">₹${place.min_price} – ₹${place.max_price || 'N/A'}</p>
                            <div class="rating-display">
                                <span class="stars-display">${renderStars(avgRating)}</span>
                                <span class="rating-text">${avgRating ? avgRating.toFixed(1) : 'No ratings'} ${ratingCount ? `(${ratingCount})` : ''}</span>
                            </div>
                            <div class="card-footer">
                                <span class="place-distance">📏 ${distLabel}</span>
                                <button class="btn-secondary" onclick="viewLocation('${place.id}'); event.stopPropagation();">View Location 📍</button>
                            </div>
                            <div class="added-by">🙋 Added by: ${place.added_by || 'Anonymous'}</div>
                        </div>
                    </div>`;
            });

            grid.innerHTML = cards.join('');
        }

        async function openSpotDetail(id) {
            const place = allPlaces.find(p => String(p.id) === String(id));
            if (!place) return;
            const modal = document.getElementById('spot-detail-modal');
            const content = document.getElementById('spot-detail-content');
            const { data: reviews } = await db.from('reviews').select('*').eq('spot_id', id).order('created_at', { ascending: false });
            const { data: { user } } = await db.auth.getUser();
            const imageUrl = place.image_url || (place.image ? place.image : 'https://images.unsplash.com/photo-1504674900247-0877df9cc836?w=600&q=80');
            const hoursHtml = place.open_time && place.close_time ? `<p class="detail-row">🕐 <strong>Hours:</strong> ${place.open_time} – ${place.close_time}</p>` : '';
            let distLabel = 'Unknown';
            if (userLat && userLng && place.lat && place.lng) {
                const d = getDistance(userLat, userLng, place.lat, place.lng);
                distLabel = d !== null ? `${d.toFixed(2)} km` : 'Unknown';
            }
            const reviewsHtml = reviews && reviews.length > 0
                ? reviews.map(r => `<div class="review-item"><div class="review-header"><span class="review-stars">${renderStars(r.rating)}</span><span class="review-author">${r.user_email || 'Anonymous'}</span></div><p class="review-text">${r.comment || ''}</p></div>`).join('')
                : '<p style="color:#94a3b8;">No reviews yet.</p>';
            const reviewFormHtml = user ? `
                <div class="add-review-box">
                    <h4>Leave a Review</h4>
                    <div class="star-picker" id="star-picker-${id}">${[1,2,3,4,5].map(i=>`<span class="star interactive-star" onclick="setReviewStar('${id}',${i})" style="font-size:1.8rem;cursor:pointer;">☆</span>`).join('')}</div>
                    <input type="hidden" id="review-rating-${id}" value="0">
                    <textarea id="review-comment-${id}" placeholder="Write your review…" class="review-textarea"></textarea>
                    <button class="btn-primary" onclick="submitReview('${id}')" style="margin-top:0.5rem;">Post Review</button>
                </div>` : `<p style="color:#94a3b8;margin-top:1rem;"><a href="auth.html" style="color:#88976c;">Login</a> to leave a review.</p>`;
            content.innerHTML = `
                <img src="${imageUrl}" alt="${place.name}" class="detail-img" onerror="this.src='https://images.unsplash.com/photo-1504674900247-0877df9cc836?w=600&q=80'">
                <div class="detail-body">
                    <h2 class="detail-title">${place.name}</h2>
                    <p class="detail-row">📍 <strong>Location:</strong> ${place.location || 'N/A'}</p>
                    <p class="detail-row">🍽️ <strong>Type:</strong> ${place.food_type || 'N/A'}</p>
                    <p class="detail-row">🥘 <strong>Foods:</strong> ${place.foods_available || 'N/A'}</p>
                    <p class="detail-row">💰 <strong>Price:</strong> ₹${place.min_price} – ₹${place.max_price || 'N/A'}</p>
                    ${hoursHtml}
                    <p class="detail-row">📏 <strong>Distance:</strong> ${distLabel}</p>
                    <p class="detail-row">📝 ${place.description || ''}</p>
                    <div class="detail-actions">
                        <button class="btn-primary" onclick="getDirections('${id}')">🗺️ Get Directions</button>
                        <button class="btn-secondary" onclick="viewLocation('${id}')">📍 View on Map</button>
                        <button class="btn-report" onclick="openReportModal('${id}')">🚩 Report</button>
                    </div>
                    <div class="reviews-section">
                        <h3>Reviews & Ratings</h3>
                        <div>${reviewsHtml}</div>
                        ${reviewFormHtml}
                    </div>
                </div>`;
            modal.style.display = 'flex';
            document.body.style.overflow = 'hidden';
        }

        function closeSpotDetail() {
            document.getElementById('spot-detail-modal').style.display = 'none';
            document.body.style.overflow = '';
        }
        document.getElementById('spot-detail-modal').addEventListener('click', function(e) { if (e.target === this) closeSpotDetail(); });

        function setReviewStar(spotId, val) {
            document.getElementById(`review-rating-${spotId}`).value = val;
            document.querySelectorAll(`#star-picker-${spotId} .interactive-star`).forEach((s,i) => s.textContent = i < val ? '★' : '☆');
        }

        async function submitReview(spotId) {
            const { data: { user } } = await db.auth.getUser();
            if (!user) { alert('Please login.'); return; }
            const rating = parseInt(document.getElementById(`review-rating-${spotId}`).value);
            const comment = document.getElementById(`review-comment-${spotId}`).value.trim();
            if (!rating) { alert('Please select a star rating.'); return; }
            const { error } = await db.from('reviews').insert([{ spot_id: spotId, user_id: user.id, user_email: user.email, rating, comment }]);
            if (error) { alert(error.message); return; }
            alert('Review posted! ✅');
            openSpotDetail(spotId);
        }

        function openReportModal(id) {
            currentReportSpotId = id;
            closeSpotDetail();
            document.getElementById('report-modal').style.display = 'flex';
            document.body.style.overflow = 'hidden';
        }
        function closeReportModal() {
            document.getElementById('report-modal').style.display = 'none';
            document.body.style.overflow = '';
        }
        document.getElementById('report-modal').addEventListener('click', function(e) { if (e.target === this) closeReportModal(); });

        async function submitReport() {
            const reason = document.getElementById('report-reason').value;
            if (!reason) { alert('Please select a reason.'); return; }
            const details = document.getElementById('report-details').value.trim();
            const { data: { user } } = await db.auth.getUser();
            const { error } = await db.from('reports').insert([{ spot_id: currentReportSpotId, reason, details, reporter_id: user?.id || null, reporter_email: user?.email || 'anonymous' }]);
            if (error) { alert(error.message); return; }
            alert('Report submitted. Thank you! ✅');
            closeReportModal();
        }

        // Init
        async function init() {
            const { data } = await db.from('food_spots').select('*');
            allPlaces = data || [];
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(pos => {
                    userLat = pos.coords.latitude;
                    userLng = pos.coords.longitude;
                    renderBookmarksPage();
                }, () => renderBookmarksPage());
            } else {
                renderBookmarksPage();
            }
        }
        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
