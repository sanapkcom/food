<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Authentication - CheapEats</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    <script src="auth.js"></script>
</head>
<body>
    <nav class="navbar">
        <div class="container">
            <h1 class="logo"><a href="index.html" style="color:white; text-decoration:none;">🍽️ EATSPOT</a></h1>
        </div>
    </nav>

    <div class="container">
        <div class="auth-container">
            <h2>CheapEats 🍴</h2>
            <form id="auth-form">
                <input type="email" id="auth-email" placeholder="Email" required>
                <input type="password" id="auth-password" placeholder="Password" required>
                <button type="submit" class="btn-primary" id="auth-btn">Sign In</button>
            </form>
            <div class="auth-error" id="auth-error"></div>
            <div class="auth-toggle">
                <span id="auth-toggle-text">Don't have an account?</span> 
                <a id="auth-toggle-link">Sign Up</a>
            </div>
        </div>
    </div>

    <script>
        let isLogin = true;
        const form = document.getElementById('auth-form');
        const emailInput = document.getElementById('auth-email');
        const passwordInput = document.getElementById('auth-password');
        const btn = document.getElementById('auth-btn');
        const errorDiv = document.getElementById('auth-error');
        const toggleText = document.getElementById('auth-toggle-text');
        const toggleLink = document.getElementById('auth-toggle-link');

        toggleLink.addEventListener('click', () => {
            isLogin = !isLogin;
            if (isLogin) {
                btn.textContent = 'Sign In';
                toggleText.textContent = "Don't have an account?";
                toggleLink.textContent = 'Sign Up';
            } else {
                btn.textContent = 'Sign Up';
                toggleText.textContent = "Already have an account?";
                toggleLink.textContent = 'Sign In';
            }
            errorDiv.style.display = 'none';
        });

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            errorDiv.style.display = 'none';
            const email = emailInput.value;
            const password = passwordInput.value;

            let result;
            if (isLogin) {
                result = await signInWithEmail(email, password);
            } else {
                result = await signUpWithEmail(email, password);
            }

            if (result.error) {
                errorDiv.textContent = result.error.message;
                errorDiv.style.display = 'block';
            } else {
                window.location.href = 'index.html';
            }
        });
    </script>
</body>
</html>
