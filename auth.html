<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login – EATSPOT</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="vercel-config.js"></script>
    <script src="auth.js"></script>
</head>
<body>
    <nav class="navbar">
        <div class="container">
            <h1 class="logo"><a href="index.html" style="color:white;text-decoration:none;">🍽️ EATSPOT</a></h1>
        </div>
    </nav>

    <div class="container">
        <div class="auth-container">
            <div style="font-size:2.8rem;margin-bottom:0.5rem;">🍽️</div>
            <h2>EATSPOT</h2>
            <p style="color:#64748b;font-size:0.95rem;margin-bottom:1.8rem;">Sign in to discover and share food spots</p>

            <form id="auth-form" style="box-shadow:none;padding:0;border:none;background:transparent;">
                <input type="email" id="auth-email" placeholder="Email address" required>
                <input type="password" id="auth-password" placeholder="Password" required>
                <button type="submit" class="btn-primary" id="auth-btn" style="width:100%;animation:none;">Sign In</button>
            </form>

            <div class="auth-error" id="auth-error"></div>
            <div class="auth-toggle">
                <span id="auth-toggle-text">Don't have an account?</span>
                <a id="auth-toggle-link"> Sign Up</a>
            </div>
        </div>
    </div>

    <script>
        let isLogin = true;
        const form = document.getElementById('auth-form');
        const emailInput = document.getElementById('auth-email');
        const passwordInput = document.getElementById('auth-password');
        const btn = document.getElementById('auth-btn');
        const errorDiv = document.getElementById('auth-error');
        const toggleText = document.getElementById('auth-toggle-text');
        const toggleLink = document.getElementById('auth-toggle-link');

        toggleLink.addEventListener('click', () => {
            isLogin = !isLogin;
            btn.textContent = isLogin ? 'Sign In' : 'Sign Up';
            toggleText.textContent = isLogin ? "Don't have an account?" : "Already have an account?";
            toggleLink.textContent = isLogin ? ' Sign Up' : ' Sign In';
            errorDiv.style.display = 'none';
        });

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            errorDiv.style.display = 'none';
            btn.textContent = '⏳ Please wait…';
            btn.disabled = true;

            const email = emailInput.value.trim();
            const password = passwordInput.value;

            let result;
            if (isLogin) {
                result = await signInWithEmail(email, password);
            } else {
                result = await signUpWithEmail(email, password);
            }

            btn.disabled = false;
            btn.textContent = isLogin ? 'Sign In' : 'Sign Up';

            if (result.error) {
                errorDiv.textContent = result.error.message;
                errorDiv.style.display = 'block';
            } else {
                window.location.href = 'index.html';
            }
        });
    </script>
</body>
</html>
