<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CheapEats - Find Cheap Food Near You</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="config.js"></script>

    <script src="https://maps.googleapis.com/maps/api/js?key=YOUR_API_KEY&callback=initMap" async defer></script>

</head>


<body>
    <nav class="navbar">
        <div class="container">
            <h1 class="logo">🍽️ CheapEats</h1>
            <div class="nav-right">
                <div class="location-indicator">
                    <span class="location-icon">📍</span>
                    <span class="location-text">Delhi, India</span>
                </div>
                <ul class="nav-links">
                    <li><a href="#home">Home</a></li>
                    <li><a href="#explore">Explore</a></li>
                    <li><a href="#add-place">Add Place</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <section id="home" class="hero">
        <div class="container">
            <h2>Delicious food, delivered fast</h2>
            <p>Order from your favorite local spots</p>
            <div class="search-container">
                <div class="search-bar">
                    <input type="text" placeholder="Search for food, restaurants, or cuisines..." id="search-input">
                    <button class="search-btn" id="search-btn">🔍</button>
                </div>
            </div>
            <button id="find-food-btn" class="btn-primary location-btn" onclick="findFood()">
                <span class="btn-icon">📍</span>
                Find cheap food near me
            </button>
            <div id="results"></div>
            <div id="map" style="height: 400px; width: 100%; margin-top: 20px; display: none;"></div>
        </div>
    </section>

    <section id="explore" class="explore">
        <div class="container">


            <div class="filters">
                <button class="filter-btn active" data-filter="all">All</button>
                <button class="filter-btn" data-filter="50">Under ₹50</button>
                <button class="filter-btn" data-filter="100">Under ₹100</button>
                <button class="filter-btn" data-filter="150">Under ₹150</button>
            </div>



            <div class="sections">
                <div class="section active" id="meals-100">
                    <h3>Meals under ₹100</h3>
                    <div class="places-grid" id="meals-100-grid"></div>
                </div>
                <div class="section" id="hidden-gems">
                    <h3>Hidden Gems</h3>
                    <div class="places-grid" id="hidden-gems-grid"></div>
                </div>
                <div class="section" id="student-offers">
                    <h3>Student Offers</h3>
                    <div class="places-grid" id="student-offers-grid"></div>
                </div>
            </div>
        </div>
    </section>

    <section id="add-place" class="add-place">
        <div class="container">
            <h3>Add a Place</h3>
            <form id="add-place-form">
                <input type="text" id="shop-name" placeholder="Shop Name" required>
                <input type="text" id="location" placeholder="Location" required>
                <input type="number" id="min-price" placeholder="Minimum Food Price (₹)" required>
                <input type="text" id="popular-item" placeholder="Popular Food Item" required>
                <input type="number" id="max-price" placeholder="Maximum Item Price (₹)" required>
                <textarea id="description" placeholder="Short Description" required></textarea>
                <button type="submit" class="btn-primary">Submit</button>
            </form>
        </div>
    </section>

    <footer class="footer">
        <div class="container">
            <p>&copy; 2024 CheapEats. Contact: info@cheapeats.com</p>
        </div>
    </footer>
    <script src="script.js"></script>
</body>

</html>
